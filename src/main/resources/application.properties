#Configuracion general
spring.application.name=fintech
server.port = 8080

#Configuracion y conexion con H2
spring.datasource.url=jdbc:h2:file:./data/fintech_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Parametros de negocio
fintech.recompensas.bono-pago-programado=15
fintech.alertas.umbral-saldo-bajo=20.0
fintech.seguridad.limite-frecuencia-minutos=5
fintech.seguridad.max-tx-por-ventana=3
fintech.seguridad.factor-monto-inusual=3.0
